<aside class="sb" [class.collapsed]="collapsed">

  <div class="brand">
    <div class="logo"><mat-icon>bolt</mat-icon></div>
    <div class="brand-text" *ngIf="!collapsed">
      <strong>Sartex</strong>
      <span>DocManager</span>
    </div>
    <button type="button" class="toggle" (click)="toggle()"
            [attr.aria-label]="collapsed ? 'Déplier le menu' : 'Replier le menu'"
            [matTooltip]="collapsed ? 'Déplier' : 'Replier'" matTooltipPosition="right">
      <mat-icon>{{ collapsed ? 'chevron_right' : 'chevron_left' }}</mat-icon>
    </button>
  </div>
  <div class="stitch" aria-hidden="true"></div>

  <nav class="nav" aria-label="Navigation principale">
    <p class="group" *ngIf="!collapsed">Navigation</p>
    <a *ngFor="let item of nav" class="item" [routerLink]="item.link"
       [class.active]="isActive(item)" [attr.aria-current]="isActive(item) ? 'page' : null"
       [matTooltip]="item.label" [matTooltipDisabled]="!collapsed" matTooltipPosition="right">
      <mat-icon>{{ item.icon }}</mat-icon>
      <span *ngIf="!collapsed">{{ item.label }}</span>
    </a>
  </nav>

  <div class="user">
    <div class="avatar" aria-hidden="true">{{ initials }}</div>
<div class="who" *ngIf="!collapsed">
  <strong [matTooltip]="email">{{ displayName }}</strong>
  <span>{{ roleLabel }}</span>
</div>
    <button type="button" class="out" (click)="logout.emit()" aria-label="Se déconnecter"
            matTooltip="Se déconnecter" matTooltipPosition="right">
      <mat-icon>logout</mat-icon>
    </button>
  </div>
</aside>
